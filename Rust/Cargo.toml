[package]
name = "nucleo-h723zg-udp-echo"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Host tests are opt-in so Rust Analyzer does not try to build Rust's standard
# test harness for the bare-metal ARM target.
default = ["firmware"]
firmware = []
wiznet = []
wiznet-offload = []
host-tests = []
# Hardware acceptance-test only: deliberately withhold MCUboot confirmation
# so the next reset must restore the previous image.
rollback-test = []

[lib]
test = false
bench = false

# Embedded firmware has no `libtest` harness on the ARM target. Explicitly
# disable Cargo's host-style test and benchmark targets for this binary.
[[bin]]
name = "nucleo-h723zg-udp-echo"
path = "src/main.rs"
test = false
bench = false
required-features = ["firmware"]

[[bin]]
name = "nucleo-h723zg-w5500-udp-echo"
path = "src/bin/w5500_udp_echo.rs"
test = false
bench = false
required-features = ["wiznet"]

[[bin]]
name = "nucleo-h723zg-w5500-offload-udp-echo"
path = "src/bin/w5500_offload_udp_echo.rs"
test = false
bench = false
required-features = ["wiznet-offload"]

[[test]]
name = "host"
path = "tests/host.rs"
required-features = ["host-tests"]

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32h723zg",
    "time-driver-tim2",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
    "tcp",
    "udp",
    "auto-icmp-echo-reply",
] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embassy-sync = "0.8.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
w5500-dhcp = { version = "0.7.0", features = ["defmt", "eh1"] }

cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
getrandom = { version = "0.2.17", default-features = false, features = ["custom"] }
heapless = { version = "0.9.1", default-features = false }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
sha2 = { version = "0.10.9", default-features = false }
static_cell = "2.1.1"
sunset = { version = "0.5.0", default-features = false, features = ["embedded-io"] }
sunset-async = { version = "0.5.0", default-features = false }

[profile.dev]
codegen-units = 1
debug = 2
incremental = false
opt-level = 2
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
# MCUboot's rollback trailer consumes one 128 KiB erase sector. Optimize for
# size so the signed application fits in the remaining two sectors.
opt-level = "z"
overflow-checks = false
