[package]
name = "nucleo-h723zg-udp-echo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32h723zg",
    "time-driver-tim2",
    "memory-x",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
    "udp",
    "auto-icmp-echo-reply",
] }

cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
heapless = { version = "0.9.1", default-features = false }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.dev]
codegen-units = 1
debug = 2
incremental = false
opt-level = 2
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3
overflow-checks = false
