# MCUboot's upstream application defaults are repeated here because this
# directory is the application configuration root for our out-of-tree build.
CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_FLASH=y
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

# Disable board peripherals that the bootloader does not use.
CONFIG_BT=n
CONFIG_I2C=n

# The bootloader runs on HSI for a reset-like handoff. The board console's
# default clock assumptions do not apply to that minimal clock tree, and a
# production bootloader does not need a UART.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# Verify every application image with an Ed25519 release signature.
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-ed25519.pem"
CONFIG_BOOT_BYPASS_KEY_MATCH=y

# The H723 has uniform 128 KiB erase sectors. Offset swap keeps rollback while
# avoiding a separate scratch partition.
CONFIG_BOOT_SWAP_USING_OFFSET=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y

# The application confirms a trial image after its network services are ready.
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

# Bare-metal Cortex-M runtimes do not necessarily rewrite VTOR. Point
# interrupts at the selected application's vector table before chain-loading.
CONFIG_BOOT_INTR_VEC_RELOC=y
CONFIG_BOOT_DISABLE_CACHES=y
