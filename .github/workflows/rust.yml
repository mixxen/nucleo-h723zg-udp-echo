name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools, rustfmt
          targets: thumbv7em-none-eabihf

      - name: Check formatting
        run: cargo fmt --check

      - name: Run host tests
        run: cargo test --locked --no-default-features --features host-tests --test host --target x86_64-unknown-linux-gnu

      - name: Check benchmark tool formatting
        run: cargo fmt --manifest-path tools/udp-benchmark/Cargo.toml --check

      - name: Test benchmark tool
        run: cargo test --locked --manifest-path tools/udp-benchmark/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Lint benchmark tool
        run: cargo clippy --locked --manifest-path tools/udp-benchmark/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

      # CI keys are disposable and exist only to link the complete firmware.
      - name: Provision disposable SSH build keys
        shell: pwsh
        run: ./tools/provision_ssh.ps1

      - name: Lint embedded firmware
        run: cargo clippy --locked --target thumbv7em-none-eabihf -- -D warnings

      - name: Build embedded firmware
        run: cargo build --locked --release

      - name: Lint native RMII UDP-only firmware
        run: cargo clippy --locked --release --no-default-features --features native-udp --bin nucleo-h723zg-native-rmii-udp-echo -- -D warnings

      - name: Build native RMII UDP-only firmware
        run: cargo build --locked --release --no-default-features --features native-udp --bin nucleo-h723zg-native-rmii-udp-echo

      - name: Lint benchmark-mode Embassy UDP server
        run: cargo clippy --locked --release --no-default-features --features native-udp,benchmark --bin nucleo-h723zg-native-rmii-udp-echo -- -D warnings

      - name: Lint performance-mode Embassy UDP server
        run: cargo clippy --locked --profile performance --no-default-features --features native-udp,performance --bin nucleo-h723zg-native-rmii-udp-echo -- -D warnings

      - name: Lint profiled native RMII firmware
        run: cargo clippy --locked --release --no-default-features --features native-udp,profiling --bin nucleo-h723zg-native-rmii-udp-echo -- -D warnings

      - name: Lint W5500 shield firmware
        run: cargo clippy --locked --release --no-default-features --features wiznet --bin nucleo-h723zg-w5500-udp-echo -- -D warnings

      - name: Build W5500 shield firmware
        run: cargo build --locked --release --no-default-features --features wiznet --bin nucleo-h723zg-w5500-udp-echo

      - name: Lint profiled W5500 MACRAW firmware
        run: cargo clippy --locked --release --no-default-features --features wiznet,profiling --bin nucleo-h723zg-w5500-udp-echo -- -D warnings

      - name: Lint W5500 hardware-offload firmware
        run: cargo clippy --locked --release --no-default-features --features wiznet-offload --bin nucleo-h723zg-w5500-offload-udp-echo -- -D warnings

      - name: Build W5500 hardware-offload firmware
        run: cargo build --locked --release --no-default-features --features wiznet-offload --bin nucleo-h723zg-w5500-offload-udp-echo

      - name: Lint benchmark-mode offload UDP server
        run: cargo clippy --locked --release --no-default-features --features wiznet-offload,benchmark --bin nucleo-h723zg-w5500-offload-udp-echo -- -D warnings

      - name: Lint performance-mode offload UDP server
        run: cargo clippy --locked --profile performance --no-default-features --features wiznet-offload,performance --bin nucleo-h723zg-w5500-offload-udp-echo -- -D warnings

      - name: Lint profiled W5500 offload firmware
        run: cargo clippy --locked --release --no-default-features --features wiznet-offload,profiling --bin nucleo-h723zg-w5500-offload-udp-echo -- -D warnings

      - name: Install disposable signing tools
        run: python -m pip install --disable-pip-version-check imgtool==2.4.0

      # This intentionally generates an ephemeral CI-only key. It proves that
      # the release ELF can be converted, signed, verified, and kept within
      # MCUboot's effective two-sector image budget without exposing a real key.
      - name: Package and verify signed test image
        run: |
          mkdir -p artifacts
          imgtool keygen --key "$RUNNER_TEMP/ci-ed25519.pem" --type ed25519
          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_objcopy="$(rustc --print sysroot)/lib/rustlib/$host_triple/bin/llvm-objcopy"
          "$llvm_objcopy" \
            -O binary \
            target/thumbv7em-none-eabihf/release/nucleo-h723zg-udp-echo \
            artifacts/firmware-unsigned.bin
          imgtool sign \
            --key "$RUNNER_TEMP/ci-ed25519.pem" \
            --align 32 \
            --max-align 32 \
            --header-size 0x200 \
            --pad-header \
            --slot-size 0x60000 \
            --max-sectors 4 \
            --version 0.0.0+0 \
            artifacts/firmware-unsigned.bin \
            artifacts/firmware-signed.bin
          imgtool verify --key "$RUNNER_TEMP/ci-ed25519.pem" artifacts/firmware-signed.bin
          test "$(stat -c%s artifacts/firmware-signed.bin)" -le 262144

      - name: Ensure private development keys are not tracked
        run: |
          test ! -e ../Bootloader/root-ed25519.pem
          test ! -e ../Bootloader/root-ed25519.pub.pem
